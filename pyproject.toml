[project]
name = "gtk-widgets"
version = "0.1.0"
description = "GTK4 popup widgets for Sway (Wayland), themed via Catppuccin Mocha tokens"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pygobject>=3.58.1,<4",
]

# The installed commands. install.sh writes a launcher for each into
# ~/.local/bin; the bash status scripts beside the widgets are linked as
# <widget>-status.
[project.scripts]
audio = "gtk_widgets.widgets.audio.main:main"
bluetooth = "gtk_widgets.widgets.bluetooth.main:main"
calendar = "gtk_widgets.widgets.calendar.main:main"
capture = "gtk_widgets.widgets.capture.main:main"
claude-usage = "gtk_widgets.widgets.claude_usage.main:main"
claude-usage-status = "gtk_widgets.widgets.claude_usage.status:main"
display = "gtk_widgets.widgets.display.main:main"
display-brightness = "gtk_widgets.widgets.display.brightness:main"
launcher = "gtk_widgets.widgets.launcher.main:main"
launcher-clipboard = "gtk_widgets.widgets.launcher.clipboard:main"
network = "gtk_widgets.widgets.network.main:main"
network-agent = "gtk_widgets.widgets.network.agent:main"
network-status = "gtk_widgets.widgets.network.status:main"
power = "gtk_widgets.widgets.power.main:main"
timer = "gtk_widgets.widgets.timer.main:main"
timer-status = "gtk_widgets.widgets.timer.status:main"
translate = "gtk_widgets.widgets.translate.main:main"
usb = "gtk_widgets.widgets.usb.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
gtk4-layer-shell-stubs = { path = "stubs/gtk4-layer-shell-stubs" }

[dependency-groups]
dev = [
    "basedpyright>=1.40.2,<2",
    "deptry>=0.25.1,<0.26",
    "gtk4-layer-shell-stubs",
    "import-linter>=2.16,<3",
    "pygobject-stubs>=2.20,<3",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-randomly>=5.1,<6",
    "pytest-timeout>=2.4.0,!=2.5.0,<3",
    "ruff>=0.17.4,<0.18",
]
