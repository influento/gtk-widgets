# The project's ruff config. py-gate's rules come from the extend; a change
# for this project goes below it.
extend = "py-gate/ruff.gate.toml"

[lint]
ignore = [
  # The tools (wl-copy, nmcli, ffmpeg, ...) come from the user's PATH by design.
  "S607",
]

[lint.extend-per-file-ignores]
# Both restart the process with gtk4-layer-shell in LD_PRELOAD.
"src/gtk_widgets/lib/ui/__init__.py" = ["S606"]
"src/gtk_widgets/widgets/launcher/main.py" = ["S606"]
