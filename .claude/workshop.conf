exclude=repos/**, workbench/**, .worktrees/**, src/gtk_widgets/lib/pulsectl/*.py, stubs/nm-stubs/src/**
# No schema library (the widgets run on the system Python): outside data is
# parsed only in modules named parse.py, whose functions take `object`.
py-gate.off.no-object-signature=*/parse.py
workbench.test_type.integration=tests/integration/**, tests/launcher_selection_test.py
workbench.test_type.e2e=tests/e2e/**
workbench.tests=tests/**, pytest.toml
