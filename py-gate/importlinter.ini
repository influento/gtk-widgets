# The project's architecture: import-linter contracts that py-gate adds to
# its own (no import cycles between sibling modules). A re-install keeps
# this file. Contracts: import-linter.readthedocs.io/en/stable/contract_types.html
#
# Layers, top to bottom: a module imports only from the layers below it.
# Example for src/<pkg>/{ui,app,domain}:
# [importlinter:contract:layers]
# name = ui above app above domain
# type = layers
# layers =
#     <pkg>.ui
#     <pkg>.app
#     <pkg>.domain
